<title>串カツ田中 ドリンクレシピ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #14181f;
    --night-2: #1c2230;
    --paper: #f4ecdd;
    --paper-2: #eee2cb;
    --red: #b2401f;
    --red-deep: #8c2f16;
    --green: #3f7d55;
    --green-deep: #2c5c3d;
    --gold: #c99a3a;
    --ink: #2b2420;
    --ink-soft: #6b6055;
    --line: rgba(43,36,32,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #232a3b 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, #202537 0%, transparent 50%),
      var(--night);
    color: var(--paper);
    font-family: "Noto Sans JP", sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .lantern-glow{
    position: fixed;
    top: -120px; left: 50%; transform: translateX(-50%);
    width: 500px; height: 320px;
    background: radial-gradient(circle, rgba(201,154,58,0.16) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  header{
    position: relative;
    z-index: 1;
    padding: calc(24px + env(safe-area-inset-top)) 20px 14px;
    text-align: center;
  }
  .kicker{
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 600;
  }
  h1{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 25px;
    margin: 0;
    letter-spacing: 0.03em;
    line-height: 1.5;
    color: var(--paper);
    text-shadow: 0 2px 18px rgba(201,154,58,0.25);
  }
  h1 span{ color: var(--paper); }

  /* -------- Top-level tab switcher -------- */
  .app-tabs{
    position: relative;
    z-index: 1;
    display: flex;
    gap: 8px;
    padding: 4px 20px 18px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .app-tab{
    flex: 1;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 14.5px;
    color: #9aa3b8;
    background: #1a2030;
    border: 1px solid rgba(201,154,58,0.18);
    border-radius: 14px;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
  }
  .app-tab .sub{
    display:block;
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 500;
    font-size: 10px;
    color: #6b7488;
    margin-top: 2px;
  }
  .app-tab.active{
    background: linear-gradient(180deg, var(--red), var(--red-deep));
    border-color: var(--red);
    color: var(--paper);
  }
  .app-tab.active .sub{ color: rgba(244,236,221,0.75); }

// ---------------- CUSTOM ADD / DELETE (persisted on this device) ----------------
const STORAGE_KEY = "kushikatsu_drink_overrides_v1";
let customAdded = [];
let deletedKeys = new Set();

function loadOverrides(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      customAdded = Array.isArray(parsed.added) ? parsed.added : [];
      deletedKeys = new Set(Array.isArray(parsed.deleted) ? parsed.deleted : []);
    }
  }catch(e){ console.warn("override load failed", e); }
}
function saveOverrides(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      added: customAdded,
      deleted: [...deletedKeys]
    }));
  }catch(e){ console.warn("override save failed", e); }
}
function itemKey(row, name){ return row + "::" + name; }

function getData(){
  const result = {};
  rows.forEach(r=>{
    result[r] = BASE_DATA[r].filter(d => !deletedKeys.has(itemKey(r, d.name)));
  });
  customAdded.forEach(item=>{
    if(!result[item.row]) result[item.row] = [];
    result[item.row].push(item);
  });
  return result;
}

let DATA = getData();
loadOverrides();
DATA = getData();

function refreshAllData(){
  DATA = getData();
  buildNav();
  renderList();
  buildRowGrid();
  updateStartState();
}

function buildNav(){
  rowNav.innerHTML = rows.map(r => `
    <button class="row-btn ${r===activeRow && !searchTerm ? 'active':''}" data-row="${r}">
      ${r}行
      <span class="count">${DATA[r].length}品</span>

  rowNav.querySelectorAll('.row-btn').forEach(btn=>{

      searchTerm = "";

      buildNav();
      renderList();
    });
  });

function allDrinksFlat(){
  return rows.flatMap(r => DATA[r].map(d => ({...d, row:r})));
}

function renderList(){
  let items;
  if(searchTerm){
    const q = searchTerm.trim();
    items = allDrinksFlat().filter(d => d.name.includes(q));
  } else {
    items = DATA[activeRow].map(d => ({...d, row: activeRow}));
  }

  if(items.length === 0){
    listArea.innerHTML = `<div class="empty-hint">「<b>${searchTerm}</b>」に一致するドリンクが<br>見つかりませんでした</div>`;
    return;
  }

  let html = '';
  if(activeRow === 'サ' && !searchTerm){
    html += `<button class="info-btn" id="shochuInfo">焼酎の種類を見る</button>`;
  }
  html += `<div class="drink-list">` + items.map((d,i) => {
    const photo = glassPhotoFor(d.glass);
    const thumb = photo
      ? `<img class="glass-thumb" src="${photo}" alt="${d.glass}">`
      : `<div class="glass-chip">${d.glass}</div>`;
    const delBtn = editMode ? `<button class="delete-x-btn" data-del-idx="${i}">✕</button>` : `<div class="arrow">›</div>`;
    return `
    <div class="drink-item ${editMode?'edit-mode':''}" data-idx="${i}" data-row="${d.row}">
      ${thumb}
      <div class="name">${d.name}</div>
      ${delBtn}
    </div>
  `;
  }).join('') + `</div>`;

  listArea.innerHTML = html;

  listArea.querySelectorAll('.drink-item').forEach((el, i)=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.delete-x-btn')) return;
      const d = items[i];
      openTicket(d);
    });
  });

  listArea.querySelectorAll('.delete-x-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const d = items[parseInt(btn.dataset.delIdx, 10)];
      deleteDrink(d);
    });
  });

  const shochuBtn = document.getElementById('shochuInfo');
  if(shochuBtn){
    shochuBtn.addEventListener('click', ()=>{
      openTicket({
        name: "焼酎の種類",
        glass: "早見",
        tool: null,
        steps: ["芋：黒霧島・白霧島・薩摩宝山・大隅", "麦：二階堂・大隅", "米：白岳しろ"]
      });
    });
  }
}

function openTicket(d){
  currentTicketItem = d;
  tName.textContent = d.name;
  tGlass.textContent = d.glass;
  const photo = glassPhotoFor(d.glass);
  tPhotoWrap.innerHTML = photo
    ? `<img class="glass-hero" src="${photo}" alt="${d.glass}">`
    : '';
  tMeta.innerHTML = d.tool ? `<div class="tag">${TOOL_LABEL[d.tool]}</div>` : '';
  tSteps.innerHTML = d.steps.map((s,i)=>`
    <div class="step">
      <div class="num">${i+1}</div>
      <div class="txt">${s}</div>
    </div>
  `).join('');
  if(d.note){
    tNote.style.display = 'block';
    tNote.textContent = d.note;
  } else {
    tNote.style.display = 'none';
  }
  // Only show delete inside the recipe ticket for real menu items (not the shochu quick-info card)
  deleteDrinkBtn.style.display = (editMode && d.row) ? 'block' : 'none';
  overlay.classList.add('open');
}
function closeTicket(){
  overlay.classList.remove('open');
  currentTicketItem = null;
}
closeBtn.addEventListener('click', closeTicket);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeTicket(); });
deleteDrinkBtn.addEventListener('click', ()=>{
  if(!currentTicketItem) return;
  deleteDrink(currentTicketItem);
  closeTicket();
});

function deleteDrink(d){
  if(!confirm(`「${d.name}」を削除しますか？`)) return;
  if(d._id){
    customAdded = customAdded.filter(item => item._id !== d._id);
  } else {
    deletedKeys.add(itemKey(d.row, d.name));
  }
  saveOverrides();
  refreshAllData();
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  let items = [];
  selectedRows.forEach(r => {
    DATA[r].forEach(d => items.push({...d, row:r}));
  });
  return shuffle(items);
}

    ${d.tool ? `<div class="back-tool">${TOOL_LABEL[d.tool]}</div>` : ''}
    ${d.note ? `<div class="back-tool">${d.note}</div>` : ''}
  `;
}

function showCard(){
  const d = deck[idx];
  flipped = false;
  card.classList.remove('flipped');
  renderFront(d);
  renderBack(d);
  progressBar.style.width = `${(idx/deck.length)*100}%`;
  counterEl.textContent = `${idx+1}/${deck.length}`;
  judgeAgain.disabled = true;
  judgeKnow.disabled = true;
}

card.addEventListener('click', ()=>{
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
  judgeAgain.disabled = !flipped;
  judgeKnow.disabled = !flipped;
});

function nextCard(knew){
  const d = deck[idx];
  if(knew){ knowCount++; } else { missed.push(d); }
  idx++;
  if(idx >= deck.length){
    finishDeck();
  } else {
    showCard();
  }
}

judgeAgain.addEventListener('click', ()=> nextCard(false));
judgeKnow.addEventListener('click', ()=> nextCard(true));

function finishDeck(){
  studyScreen.style.display = 'none';
  resultScreen.style.display = 'flex';
  document.getElementById('knowCount').textContent = knowCount;
  document.getElementById('againCount').textContent = missed.length;
  document.getElementById('retryMissedBtn').style.display = missed.length>0 ? 'block' : 'none';
}

document.getElementById('retryMissedBtn').addEventListener('click', ()=>{
  startStudy(shuffle(missed));
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  startStudy(buildDeck());
});
document.getElementById('backToSetupBtn').addEventListener('click', ()=>{
  resultScreen.style.display = 'none';
  setupScreen.style.display = 'flex';
});
document.getElementById('exitBtn').addEventListener('click', ()=>{
  studyScreen.style.display = 'none';
  setupScreen.style.display = 'flex';
});
</script>
</body>
</html>
