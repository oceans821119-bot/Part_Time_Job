<title>串カツ田中 ドリンクレシピ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #14181f;
    --night-2: #1c2230;
    --paper: #f4ecdd;
    --paper-2: #eee2cb;
    --red: #b2401f;
    --red-deep: #8c2f16;
    --green: #3f7d55;
    --green-deep: #2c5c3d;
    --gold: #c99a3a;
    --ink: #2b2420;
    --ink-soft: #6b6055;
    --line: rgba(43,36,32,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #232a3b 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, #202537 0%, transparent 50%),
      var(--night);
    color: var(--paper);
    font-family: "Noto Sans JP", sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .lantern-glow{
    position: fixed;
    top: -120px; left: 50%; transform: translateX(-50%);
    width: 500px; height: 320px;
    background: radial-gradient(circle, rgba(201,154,58,0.16) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  header{
    position: relative;
    z-index: 1;
    padding: calc(24px + env(safe-area-inset-top)) 20px 14px;
    text-align: center;
  }
  .kicker{
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 600;
  }
  h1{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 25px;
    margin: 0;
    letter-spacing: 0.03em;
    line-height: 1.5;
    color: var(--paper);
    text-shadow: 0 2px 18px rgba(201,154,58,0.25);
  }
  h1 span{ color: var(--paper); }

  /* -------- Top-level tab switcher -------- */
  .app-tabs{
    position: relative;
    z-index: 1;
    display: flex;
    gap: 8px;
    padding: 4px 20px 18px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .app-tab{
    flex: 1;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 14.5px;
    color: #9aa3b8;
    background: #1a2030;
    border: 1px solid rgba(201,154,58,0.18);
    border-radius: 14px;
    padding: 12px 8px;
    cursor: pointer;
    text-align: center;
  }
  .app-tab .sub{
    display:block;
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 500;
    font-size: 10px;
    color: #6b7488;
    margin-top: 2px;
  }
  .app-tab.active{
    background: linear-gradient(180deg, var(--red), var(--red-deep));
    border-color: var(--red);
    color: var(--paper);
  }
  .app-tab.active .sub{ color: rgba(244,236,221,0.75); }

  main{ flex:1; display:flex; flex-direction:column; }

  /* ================= LOOKUP VIEW ================= */
  #lookupView{
    position: relative;
    z-index: 1;
    flex: 1;
    display: none;
    flex-direction: column;
  }
  #lookupView.active{ display:flex; }

  .search-wrap{
    padding: 0 16px 6px;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }
  .search-input{
    width: 100%;
    background: #1a2030;
    border: 1px solid rgba(201,154,58,0.2);
    color: var(--paper);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: "Noto Sans JP", sans-serif;
  }
  .search-input::placeholder{ color: #6d7690; }
  .search-input:focus{ outline: none; border-color: var(--gold); }

  .edit-bar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    padding: 4px 16px 0;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }
  .edit-toggle-btn{
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    background: none;
    border: 1px solid rgba(201,154,58,0.3);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
  }
  .edit-toggle-btn.on{
    background: var(--gold);
    color: var(--night);
    border-color: var(--gold);
  }
  .add-drink-btn{
    font-size: 12.5px;
    font-weight: 700;
    color: var(--night);
    background: linear-gradient(180deg, var(--gold), #b3862c);
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }

  .drink-item.edit-mode{ padding-right: 10px; }
  .delete-x-btn{
    flex: 0 0 auto;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(178,64,31,0.18);
    color: #e08a6a;
    font-size: 15px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .delete-drink-btn{
    display:block;
    width: 100%;
    margin-top: 20px;
    background: none;
    border: 1px solid rgba(178,64,31,0.4);
    color: var(--red);
    font-weight: 700;
    font-size: 13.5px;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
  }

  .form-field{
    margin-top: 16px;
    display:flex;
    flex-direction:column;
    gap: 6px;
  }
  .form-field label{
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .form-field input,
  .form-field select,
  .form-field textarea{
    font-family: "Noto Sans JP", sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper-2);
    border: 1px solid rgba(43,36,32,0.18);
    border-radius: 10px;
    padding: 11px 12px;
    resize: vertical;
  }
  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus{
    outline: none;
    border-color: var(--red);
  }
  .save-drink-btn{
    width: 100%;
    margin-top: 22px;
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--paper);
    background: linear-gradient(180deg, var(--red), var(--red-deep));
    border: none;
    border-radius: 14px;
    padding: 15px;
    cursor: pointer;
  }

  .row-nav{
    display: flex;
    gap: 8px;
    padding: 12px 16px 14px;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }
  .row-nav::-webkit-scrollbar{ display:none; }
  .row-btn{
    flex: 0 0 auto;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--paper);
    background: linear-gradient(180deg, #232a3b, #1a2030);
    border: 1px solid rgba(201,154,58,0.25);
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease, border-color .2s ease;
    white-space: nowrap;
  }
  .row-btn .count{
    display:block;
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 500;
    font-size: 9px;
    color: #8791a8;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }
  .row-btn.active{
    background: linear-gradient(180deg, var(--red), var(--red-deep));
    border-color: var(--red);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(178,64,31,0.35);
  }
  .row-btn.active .count{ color: rgba(244,236,221,0.8); }
  .row-btn:active{ transform: scale(0.96); }

  #lookupMain{
    padding: 6px 16px 20px;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }

  .empty-hint{
    text-align:center;
    color:#7c869c;
    font-size: 13px;
    padding: 60px 20px;
    line-height: 1.9;
  }
  .empty-hint b{ color: var(--gold); font-family:"Shippori Mincho",serif; font-size:16px; }

  .drink-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .drink-item{
    display:flex;
    align-items:center;
    gap: 12px;
    background: linear-gradient(180deg, #1d2333, #182030);
    border: 1px solid rgba(201,154,58,0.16);
    border-radius: 12px;
    padding: 13px 14px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .drink-item:active{ background:#232b3f; }
  .drink-item .glass-chip{
    flex: 0 0 auto;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--night);
    background: var(--gold);
    padding: 5px 8px;
    border-radius: 7px;
    text-align: center;
    line-height: 1.2;
    min-width: 44px;
  }
  .drink-item .glass-thumb{
    flex: 0 0 auto;
    width: 44px; height: 44px;
    object-fit: cover;
    border-radius: 9px;
    border: 1px solid rgba(201,154,58,0.3);
    background: #0f1420;
  }
  .drink-item .name{
    flex: 1;
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--paper);
  }
  .drink-item .arrow{
    color: var(--gold);
    font-size: 14px;
    opacity: 0.7;
  }

  .ticket-overlay{
    position: fixed; inset: 0;
    background: rgba(10,12,18,0.72);
    backdrop-filter: blur(2px);
    z-index: 20;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease;
  }
  .ticket-overlay.open{ opacity: 1; pointer-events: auto; }

  .ticket{
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 22px 22px 0 0;
    padding: 26px 22px calc(30px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .28s cubic-bezier(.2,.8,.25,1);
    max-height: 82vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
  }
  .ticket-overlay.open .ticket{ transform: translateY(0); }

  .ticket::before{
    content:"";
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 4px;
    border-radius: 3px;
    background: rgba(43,36,32,0.2);
  }

  .ticket-head{
    display:flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding-bottom: 14px;
    border-bottom: 2px dashed rgba(43,36,32,0.22);
  }
  .ticket-name{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 23px;
    line-height: 1.35;
  }
  .ticket-glass{
    flex: 0 0 auto;
    background: var(--red);
    color: var(--paper);
    font-size: 11px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    margin-top: 2px;
  }

  .ticket-meta{
    display:flex;
    gap: 14px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .ticket-meta .tag{
    display:flex; align-items:center; gap:5px;
  }

  .glass-hero{
    display: block;
    width: 100%;
    max-width: 220px;
    margin: 16px auto 0;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(43,36,32,0.25);
    background: #ece0c8;
  }

  .ticket-steps{
    margin-top: 18px;
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .step{
    display:flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--paper-2);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .step .num{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 14px;
    color: var(--paper);
    background: var(--ink);
    width: 22px; height: 22px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    flex: 0 0 auto;
    margin-top: 1px;
  }
  .step .txt{
    font-size: 14.5px;
    line-height: 1.55;
    font-weight: 500;
  }

  .ticket-note{
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-soft);
    background: rgba(178,64,31,0.08);
    border-left: 3px solid var(--red);
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    line-height: 1.6;
  }

  .close-btn{
    position:absolute;
    top: 20px; right: 18px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(43,36,32,0.08);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .info-btn{
    display:block;
    margin: 4px 0 12px auto;
    background: none;
    border: 1px solid rgba(201,154,58,0.35);
    color: var(--gold);
    font-size: 11.5px;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  .lookup-footer{
    text-align:center;
    font-size: 10.5px;
    color: #576078;
    padding: 12px 20px calc(20px + env(safe-area-inset-bottom));
    letter-spacing: 0.04em;
  }

  /* ================= FLASHCARD VIEW ================= */
  #flashView{
    position: relative;
    z-index: 1;
    flex: 1;
    display: none;
    flex-direction: column;
  }
  #flashView.active{ display:flex; }

  #setupScreen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 8px 20px calc(30px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    width:100%;
  }
  .setup-label{
    font-size: 12.5px;
    color: #9aa3b8;
    margin: 18px 2px 10px;
    letter-spacing: 0.03em;
  }
  .row-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .row-chip{
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--paper);
    background: linear-gradient(180deg, #232a3b, #1a2030);
    border: 1px solid rgba(201,154,58,0.25);
    border-radius: 12px;
    padding: 12px 4px;
    text-align:center;
    cursor:pointer;
  }
  .row-chip .n{
    display:block;
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size: 9.5px;
    color:#8791a8;
    margin-top:2px;
  }
  .row-chip.selected{
    background: linear-gradient(180deg, var(--red), var(--red-deep));
    border-color: var(--red);
  }
  .row-chip.selected .n{ color: rgba(244,236,221,0.85); }

  .quick-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .quick-btn{
    flex:1;
    font-size: 12px;
    color: var(--gold);
    background:none;
    border: 1px solid rgba(201,154,58,0.3);
    border-radius: 999px;
    padding: 8px;
    cursor:pointer;
  }

  .start-btn{
    margin-top: 28px;
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--night);
    background: linear-gradient(180deg, var(--gold), #b3862c);
    border: none;
    border-radius: 16px;
    padding: 17px;
    cursor:pointer;
    box-shadow: 0 10px 26px rgba(201,154,58,0.25);
  }
  .start-btn:disabled{
    opacity: 0.4;
    box-shadow:none;
  }
  .start-count{
    text-align:center;
    font-size: 12px;
    color: #7c869c;
    margin-top: 10px;
  }

  .mode-toggle{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .mode-btn{
    flex:1;
    font-size: 12.5px;
    font-weight:600;
    color: var(--paper);
    background: #1a2030;
    border: 1px solid rgba(201,154,58,0.2);
    border-radius: 12px;
    padding: 12px 8px;
    cursor:pointer;
    text-align:center;
    line-height:1.5;
  }
  .mode-btn .sub{ display:block; font-size:10px; color:#7c869c; font-weight:400;}
  .mode-btn.selected{
    background: linear-gradient(180deg, #232a3b, #1a2030);
    border-color: var(--gold);
    color: var(--gold);
  }
  .mode-btn.selected .sub{ color: rgba(201,154,58,0.7); }

  #studyScreen{
    flex:1;
    display:none;
    flex-direction:column;
    padding: 0 18px 22px;
    max-width: 480px;
    margin:0 auto;
    width:100%;
  }
  .study-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 4px 2px 14px;
  }
  .exit-btn{
    background:none;
    border:none;
    color:#8791a8;
    font-size: 13px;
    cursor:pointer;
    padding:6px 4px;
  }
  .progress-wrap{
    flex:1;
    margin: 0 14px;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background: linear-gradient(90deg, var(--gold), #e0b65a);
    border-radius:4px;
    transition: width .25s ease;
  }
  .counter{
    font-size: 12px;
    color:#9aa3b8;
    font-variant-numeric: tabular-nums;
    min-width: 42px;
    text-align:right;
  }

  .card-zone{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective: 1400px;
    padding: 6px 0 18px;
  }
  .card{
    width: 100%;
    max-width: 360px;
    height: 420px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.25,1);
    cursor:pointer;
  }
  .card.flipped{ transform: rotateY(180deg); }
  .card-face{
    position:absolute;
    inset:0;
    backface-visibility: hidden;
    border-radius: 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 30px 24px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  }
  .card-front{
    background: linear-gradient(165deg, #232a3b, #171d2c);
    border: 1px solid rgba(201,154,58,0.25);
  }
  .front-eyebrow{
    font-size: 10.5px;
    letter-spacing: 0.28em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .front-name{
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: 27px;
    text-align:center;
    line-height: 1.5;
    color: var(--paper);
  }
  .front-hint{
    margin-top: 22px;
    font-size: 12px;
    color: #7c869c;
  }
  .front-glass-hint{
    margin-top: 16px;
    font-size: 11px;
    background: rgba(201,154,58,0.12);
    color: var(--gold);
    border-radius: 999px;
    padding: 6px 14px;
  }

  .card-back{
    background: var(--paper);
    color: var(--ink);
    transform: rotateY(180deg);
    overflow-y:auto;
    align-items:stretch;
    justify-content:flex-start;
    padding: 22px 20px;
  }
  .back-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    border-bottom: 2px dashed rgba(43,36,32,0.2);
    padding-bottom: 12px;
  }
  .back-name{
    font-family:"Shippori Mincho",serif;
    font-weight:800;
    font-size:19px;
    line-height:1.35;
  }
  .back-glass-tag{
    flex:0 0 auto;
    background: var(--red);
    color: var(--paper);
    font-size: 10.5px;
    font-weight:700;
    padding:5px 9px;
    border-radius: 8px;
    white-space:nowrap;
  }
  .back-photo{
    display:block;
    width: 88px;
    margin: 12px auto 4px;
    border-radius: 10px;
    background:#ece0c8;
  }
  .back-steps{
    margin-top: 10px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .back-step{
    display:flex;
    gap:9px;
    align-items:flex-start;
    background: var(--paper-2);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 13px;
    line-height:1.5;
    font-weight:500;
  }
  .back-step .num{
    font-family:"Shippori Mincho",serif;
    font-weight:800;
    font-size:11.5px;
    color:var(--paper);
    background:var(--ink);
    width:18px;height:18px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .back-tool{
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .judge-btns{
    display:flex;
    gap: 10px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .judge-btn{
    flex:1;
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size: 15px;
    border:none;
    border-radius: 14px;
    padding: 15px;
    cursor:pointer;
  }
  .judge-again{
    background: linear-gradient(180deg, var(--red), var(--red-deep));
    color: var(--paper);
  }
  .judge-know{
    background: linear-gradient(180deg, var(--green), var(--green-deep));
    color: var(--paper);
  }
  .judge-btn:disabled{ opacity:0.35; }

  .flip-hint{
    text-align:center;
    font-size: 11.5px;
    color:#7c869c;
    margin-bottom: 12px;
  }

  #resultScreen{
    flex:1;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 20px 24px calc(40px + env(safe-area-inset-bottom));
    text-align:center;
    max-width: 440px;
    margin:0 auto;
  }
  .result-emoji{ font-size: 44px; margin-bottom: 6px; }
  .result-title{
    font-family:"Shippori Mincho",serif;
    font-weight:800;
    font-size: 24px;
  }
  .result-stats{
    display:flex;
    gap: 14px;
    margin: 22px 0 8px;

  }
  .stat-box{
    flex:1;
    background: linear-gradient(180deg, #232a3b, #1a2030);
    border: 1px solid rgba(201,154,58,0.2);
    border-radius: 14px;
    padding: 16px 10px;
  }
  .stat-num{
    font-family:"Shippori Mincho",serif;
    font-weight:800;
    font-size: 26px;
  }
  .stat-num.good{ color: #6bbf8a; }
  .stat-num.bad{ color: #e08a6a; }
  .stat-label{ font-size: 11px; color:#8791a8; margin-top:4px; }

  .result-btn{
    width:100%;
    margin-top: 14px;
    font-weight:700;
    font-size: 14.5px;
    border-radius: 14px;
    padding: 15px;
    cursor:pointer;
    border: none;
  }
  .result-btn.primary{
    background: linear-gradient(180deg, var(--gold), #b3862c);
    color: var(--night);
    font-family:"Shippori Mincho",serif;
    font-weight:800;
    font-size:16px;
  }
  .result-btn.secondary{
    background: none;
    color: #9aa3b8;
    border: 1px solid rgba(255,255,255,0.15);
  }
</style>
</head>
<body>

<div class="lantern-glow"></div>

<header>
  <div class="kicker">Kushikatsu Tanaka</div>
  <h1>串カツ田中<br><span>ドリンクレシピ</span></h1>
</header>

<div class="app-tabs">
  <button class="app-tab active" id="tabLookup" data-tab="lookup">
    簡易表
    <span class="sub">レシピを調べる</span>
  </button>
  <button class="app-tab" id="tabFlash" data-tab="flash">
    単語帳
    <span class="sub">暗記して覚える</span>
  </button>
</div>

<main>
  <!-- ================= LOOKUP VIEW ================= -->
  <div id="lookupView" class="active">
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="ドリンク名で検索…" />
    </div>
    <div class="edit-bar">
      <button class="edit-toggle-btn" id="editToggleBtn">✎ 編集</button>
      <button class="add-drink-btn" id="addDrinkBtn" style="display:none;">＋ ドリンクを追加</button>
    </div>
    <nav class="row-nav" id="rowNav"></nav>
    <div id="lookupMain">
      <div id="listArea"></div>
    </div>
    <div class="lookup-footer">※ ドリンクは全て9分目まで注ぐ／奇数と「田中」はメガジョッキ、偶数・ゾロ目は普通サイズ</div>
  </div>

  <!-- ================= FLASHCARD VIEW ================= -->
  <div id="flashView">
    <div id="setupScreen">
      <div class="setup-label">出題する行を選ぶ</div>
      <div class="row-grid" id="rowGrid"></div>
      <div class="quick-actions">
        <button class="quick-btn" id="selectAllBtn">全部選択</button>
        <button class="quick-btn" id="selectNoneBtn">選択解除</button>
      </div>

      <div class="setup-label">出題形式</div>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn selected" data-mode="name">
          名前 → レシピ
          <span class="sub">ドリンク名から材料を思い出す</span>
        </button>
        <button class="mode-btn" data-mode="recipe">
          レシピ → 名前
          <span class="sub">材料からドリンク名を当てる</span>
        </button>
      </div>

      <button class="start-btn" id="startBtn">はじめる</button>
      <div class="start-count" id="startCount"></div>
    </div>

    <div id="studyScreen">
      <div class="study-top">
        <button class="exit-btn" id="exitBtn">✕ やめる</button>
        <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <div class="counter" id="counter">1/1</div>
      </div>

      <div class="card-zone">
        <div class="card" id="card">
          <div class="card-face card-front" id="cardFront"></div>
          <div class="card-face card-back" id="cardBack"></div>
        </div>
      </div>

      <div class="flip-hint">カードをタップして答えを確認</div>
      <div class="judge-btns">
        <button class="judge-btn judge-again" id="judgeAgain" disabled>もう一度</button>
        <button class="judge-btn judge-know" id="judgeKnow" disabled>覚えた！</button>
      </div>
    </div>

    <div id="resultScreen">
      <div class="result-emoji">🏮</div>
      <div class="result-title">お疲れさまでした</div>
      <div class="result-stats">
        <div class="stat-box">
          <div class="stat-num good" id="knowCount">0</div>
          <div class="stat-label">覚えた</div>
        </div>
        <div class="stat-box">
          <div class="stat-num bad" id="againCount">0</div>
          <div class="stat-label">要復習</div>
        </div>
      </div>
      <button class="result-btn primary" id="retryMissedBtn">苦手だけもう一周</button>
      <button class="result-btn secondary" id="restartBtn">最初からやり直す</button>
      <button class="result-btn secondary" id="backToSetupBtn">出題範囲を変える</button>
    </div>
  </div>
</main>

<div class="ticket-overlay" id="overlay">

// ---------------- CUSTOM ADD / DELETE (persisted on this device) ----------------
const STORAGE_KEY = "kushikatsu_drink_overrides_v1";
let customAdded = [];
let deletedKeys = new Set();

function loadOverrides(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      customAdded = Array.isArray(parsed.added) ? parsed.added : [];
      deletedKeys = new Set(Array.isArray(parsed.deleted) ? parsed.deleted : []);
    }
  }catch(e){ console.warn("override load failed", e); }
}
function saveOverrides(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      added: customAdded,
      deleted: [...deletedKeys]
    }));
  }catch(e){ console.warn("override save failed", e); }
}
function itemKey(row, name){ return row + "::" + name; }

function getData(){
  const result = {};
  rows.forEach(r=>{
    result[r] = BASE_DATA[r].filter(d => !deletedKeys.has(itemKey(r, d.name)));
  });
  customAdded.forEach(item=>{
    if(!result[item.row]) result[item.row] = [];
    result[item.row].push(item);
  });
  return result;
}

let DATA = getData();
loadOverrides();
DATA = getData();

function refreshAllData(){
  DATA = getData();
  buildNav();
  renderList();
  buildRowGrid();
  updateStartState();
}

function buildNav(){
  rowNav.innerHTML = rows.map(r => `
    <button class="row-btn ${r===activeRow && !searchTerm ? 'active':''}" data-row="${r}">
      ${r}行
      <span class="count">${DATA[r].length}品</span>

  rowNav.querySelectorAll('.row-btn').forEach(btn=>{

      searchTerm = "";

      buildNav();
      renderList();
    });
  });

function allDrinksFlat(){
  return rows.flatMap(r => DATA[r].map(d => ({...d, row:r})));
}

function renderList(){
  let items;
  if(searchTerm){
    const q = searchTerm.trim();
    items = allDrinksFlat().filter(d => d.name.includes(q));
  } else {
    items = DATA[activeRow].map(d => ({...d, row: activeRow}));
  }

  if(items.length === 0){
    listArea.innerHTML = `<div class="empty-hint">「<b>${searchTerm}</b>」に一致するドリンクが<br>見つかりませんでした</div>`;
    return;
  }

  let html = '';
  if(activeRow === 'サ' && !searchTerm){
    html += `<button class="info-btn" id="shochuInfo">焼酎の種類を見る</button>`;
  }
  html += `<div class="drink-list">` + items.map((d,i) => {
    const photo = glassPhotoFor(d.glass);
    const thumb = photo
      ? `<img class="glass-thumb" src="${photo}" alt="${d.glass}">`
      : `<div class="glass-chip">${d.glass}</div>`;
    const delBtn = editMode ? `<button class="delete-x-btn" data-del-idx="${i}">✕</button>` : `<div class="arrow">›</div>`;
    return `
    <div class="drink-item ${editMode?'edit-mode':''}" data-idx="${i}" data-row="${d.row}">
      ${thumb}
      <div class="name">${d.name}</div>
      ${delBtn}
    </div>
  `;
  }).join('') + `</div>`;

  listArea.innerHTML = html;

  listArea.querySelectorAll('.drink-item').forEach((el, i)=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.delete-x-btn')) return;
      const d = items[i];
      openTicket(d);
    });
  });

  listArea.querySelectorAll('.delete-x-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const d = items[parseInt(btn.dataset.delIdx, 10)];
      deleteDrink(d);
    });
  });

  const shochuBtn = document.getElementById('shochuInfo');
  if(shochuBtn){
    shochuBtn.addEventListener('click', ()=>{
      openTicket({
        name: "焼酎の種類",
        glass: "早見",
        tool: null,
        steps: ["芋：黒霧島・白霧島・薩摩宝山・大隅", "麦：二階堂・大隅", "米：白岳しろ"]
      });
    });
  }
}

function openTicket(d){
  currentTicketItem = d;
  tName.textContent = d.name;
  tGlass.textContent = d.glass;
  const photo = glassPhotoFor(d.glass);
  tPhotoWrap.innerHTML = photo
    ? `<img class="glass-hero" src="${photo}" alt="${d.glass}">`
    : '';
  tMeta.innerHTML = d.tool ? `<div class="tag">${TOOL_LABEL[d.tool]}</div>` : '';
  tSteps.innerHTML = d.steps.map((s,i)=>`
    <div class="step">
      <div class="num">${i+1}</div>
      <div class="txt">${s}</div>
    </div>
  `).join('');
  if(d.note){
    tNote.style.display = 'block';
    tNote.textContent = d.note;
  } else {
    tNote.style.display = 'none';
  }
  // Only show delete inside the recipe ticket for real menu items (not the shochu quick-info card)
  deleteDrinkBtn.style.display = (editMode && d.row) ? 'block' : 'none';
  overlay.classList.add('open');
}
function closeTicket(){
  overlay.classList.remove('open');
  currentTicketItem = null;
}
closeBtn.addEventListener('click', closeTicket);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeTicket(); });
deleteDrinkBtn.addEventListener('click', ()=>{
  if(!currentTicketItem) return;
  deleteDrink(currentTicketItem);
  closeTicket();
});

function deleteDrink(d){
  if(!confirm(`「${d.name}」を削除しますか？`)) return;
  if(d._id){
    customAdded = customAdded.filter(item => item._id !== d._id);
  } else {
    deletedKeys.add(itemKey(d.row, d.name));
  }
  saveOverrides();
  refreshAllData();
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  let items = [];
  selectedRows.forEach(r => {
    DATA[r].forEach(d => items.push({...d, row:r}));
  });
  return shuffle(items);
}

    ${d.tool ? `<div class="back-tool">${TOOL_LABEL[d.tool]}</div>` : ''}
    ${d.note ? `<div class="back-tool">${d.note}</div>` : ''}
  `;
}

function showCard(){
  const d = deck[idx];
  flipped = false;
  card.classList.remove('flipped');
  renderFront(d);
  renderBack(d);
  progressBar.style.width = `${(idx/deck.length)*100}%`;
  counterEl.textContent = `${idx+1}/${deck.length}`;
  judgeAgain.disabled = true;
  judgeKnow.disabled = true;
}

card.addEventListener('click', ()=>{
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
  judgeAgain.disabled = !flipped;
  judgeKnow.disabled = !flipped;
});

function nextCard(knew){
  const d = deck[idx];
  if(knew){ knowCount++; } else { missed.push(d); }
  idx++;
  if(idx >= deck.length){
    finishDeck();
  } else {
    showCard();
  }
}

judgeAgain.addEventListener('click', ()=> nextCard(false));
judgeKnow.addEventListener('click', ()=> nextCard(true));

function finishDeck(){
  studyScreen.style.display = 'none';
  resultScreen.style.display = 'flex';
  document.getElementById('knowCount').textContent = knowCount;
  document.getElementById('againCount').textContent = missed.length;
  document.getElementById('retryMissedBtn').style.display = missed.length>0 ? 'block' : 'none';
}

document.getElementById('retryMissedBtn').addEventListener('click', ()=>{
  startStudy(shuffle(missed));
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  startStudy(buildDeck());
});
document.getElementById('backToSetupBtn').addEventListener('click', ()=>{
  resultScreen.style.display = 'none';
  setupScreen.style.display = 'flex';
});
document.getElementById('exitBtn').addEventListener('click', ()=>{
  studyScreen.style.display = 'none';
  setupScreen.style.display = 'flex';
});
</script>
</body>
</html>
